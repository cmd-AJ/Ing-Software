server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-VA8O2hAdooB288EpSTrGLl7z3QikbWU9wwoebO/QaYk=' 'sha256-+5XkZFazzJo8n0iOP4ti/cLCMUudTf//Mzkb7xNPXIc=' 'sha256-MS6/3FCg4WjP9gwgaBGwLpRCY6fZBgwmhVCdrPrNf3E='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: http://localhost:3001 https://img.freepik.com https://d11cuk1a0j5b57.cloudfront.net https://www.serena-care.com https://www.minifiv.es https://www.beaconjournal.com https://st.depositphotos.com https://st2.depositphotos.com https://s3-us-west-2.amazonaws.com https://novaciencia.es https://miro.medium.com https://assets-global.website-files.com https://encrypted-tbn0.gstatic.com https://haiilo.com https://i.seadn.io https://images.unsplash.com https://images4.fanpop.com https://img.magnific.com; connect-src 'self' http://localhost:3001 https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # SPA: las rutas de React Router las resuelve el cliente
    location / {
        try_files $uri $uri/ /index.html;
    }
}
